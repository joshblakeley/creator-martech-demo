# MCP server for the orchestrator: campaign rollups only.
#
# Deliberately has NO data policy. These views carry no personal details and no
# per-creator contact data, so there is nothing to reshape.
#
# A manifest is a `rpai mcp get <name> -o yaml` dump — the resource itself, led
# by @type. `rpai mcp apply` creates it if absent, otherwise updates only the
# fields present here that differ from live.
#
# Two settings matter. Please don't tidy them away:
#
#   rowFormat: ROW_FORMAT_OBJECT
#     Kept consistent with the other two servers. It is what makes per-column
#     data policies expressible, should this server ever need one.
#
#   responseFormat: MCP_RESPONSE_FORMAT_TOON
#     Packs table results into a denser form and drops a duplicate copy the
#     server otherwise sends. On a 15-row query: 7,330 -> 1,244 bytes. Lossless.
#     Saves cost and context, not time — elapsed time tracks how much the model
#     writes, not how much it reads.
#
# allowed_schemas is set here but not enforced: a server scoped
# to one schema still reads others. The real boundary is the database grant in
# config/sql/03-roles.sql, which `make prove-grants` tests. readonly,
# max_rows_limit and blocked_patterns in the same block are enforced.

# response_format is deliberately set to UNSPECIFIED, not left out.
#
# MCP_RESPONSE_FORMAT_TOON packs rows into a positional grid and cuts the payload
# substantially. It also makes the model align values to a header itself, and the
# two orderings in the payload disagree: `columns` keeps SQL order while the
# record key list is alphabetised. The agent then quotes the wrong column's
# value — a conversions count reported as a creator id, for instance. The plain
# encoding keys every value explicitly and has no such failure.
#
# It does not reduce elapsed time either: that tracks how much the model writes,
# not how much it reads.
#
# Written explicitly rather than omitted, because apply leaves fields a manifest
# does not name untouched — deleting the line would not turn it off.

'@type': type.googleapis.com/redpanda.api.adp.v1alpha1.MCPServer
response_format: MCP_RESPONSE_FORMAT_UNSPECIFIED
name: campaign-sql
type: MCP_SERVER_TYPE_MANAGED
enabled: true
description: Campaign rollups, for the orchestrator

managed:
  config:
    '@type': type.googleapis.com/redpanda.mcps.sql.v1.SQLMCPConfig
    driver: postgres
    # An interpolation expression, not the secret's name. A bare name makes the
    # driver try to parse it as a connection string and every attempt to connect
    # returns HTTP 500 with no hint why.
    dsn: ${secrets.PG_CAMPAIGN_DSN}
    row_format: ROW_FORMAT_OBJECT
    connection_pool:
      max_open_conns: 5
      max_idle_conns: 2
    guardrails:
      readonly: true
      # Not a performance setting. At 15 the scout only sees creators that
      # already pass and reports no exclusions, which is the most useful part
      # of its answer.
      max_rows_default: 60
      max_rows_limit: 500
      query_timeout: 20s
      allowed_schemas: [campaign]
      blocked_patterns:
        - '(?i)\bDROP\b'
        - '(?i)\bTRUNCATE\b'
        - '(?i)\bALTER\b'
